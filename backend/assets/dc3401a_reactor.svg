<svg viewBox="0 0 900 560" width="900" height="560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid_dc" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
      <circle cx="0" cy="0" r="1" fill="#334155" opacity="0.8" />
    </pattern>
    <linearGradient id="vesselGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="catalystPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="0.8" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="#070b12" />
  <rect width="900" height="560" fill="url(#grid_dc)" />

  <!-- Drawing Border & Header -->
  <rect x="20" y="20" width="860" height="520" fill="none" stroke="#334155" stroke-width="1.5" />
  <rect x="30" y="30" width="280" height="50" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
  <text x="44" y="52" fill="#f59e0b" font-family="monospace" font-size="13" font-weight="bold">DC-3401A · CATALYST REACTOR</text>
  <text x="44" y="70" fill="#94a3b8" font-family="monospace" font-size="10.5">FIXED-BED CATALYTIC REDUCTION COLUMN</text>

  <!-- Title block right -->
  <g transform="translate(630, 30)">
    <rect width="240" height="40" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="14" y="18" fill="#94a3b8" font-family="monospace" font-size="9.5">CATALYST: Pd / Al2O3 EXTRUDATE</text>
    <text x="14" y="32" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">INTERLOCK: SEQ-3401 TSHH SHUTDOWN</text>
  </g>

  <!-- Vertical Skirt Support Foundation -->
  <rect x="270" y="445" width="360" height="55" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <rect x="250" y="500" width="400" height="15" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <text x="450" y="480" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">CONCRETE PIER FOUNDATION</text>

  <!-- ================= COMPONENT 4: REACTOR VESSEL (left: 240, top: 100, right: 660, bottom: 460) ================= -->
  <g id="reactor_vessel">
    <!-- Top Dished Head -->
    <path d="M 260 160 Q 450 90 640 160 Z" fill="url(#vesselGrad)" stroke="#64748b" stroke-width="2.5" />
    <!-- Cylindrical Shell -->
    <rect x="260" y="160" width="380" height="250" fill="url(#vesselGrad)" stroke="#64748b" stroke-width="2.5" />
    <!-- Bottom Dished Head -->
    <path d="M 260 410 Q 450 470 640 410 Z" fill="url(#vesselGrad)" stroke="#64748b" stroke-width="2.5" />

    <!-- Top Inlet Nozzle -->
    <rect x="420" y="65" width="60" height="45" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <rect x="405" y="55" width="90" height="12" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="1.2" />
    <text x="450" y="48" fill="#38bdf8" font-family="monospace" font-size="9.5" text-anchor="middle">H2 + N2 FEED</text>

    <!-- Bottom Discharge Nozzle -->
    <rect x="425" y="440" width="50" height="40" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <rect x="412" y="480" width="76" height="12" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="1.2" />
  </g>

  <!-- Internal Cutaway Window -->
  <rect x="285" y="180" width="330" height="235" rx="6" fill="#080e1a" stroke="#334155" stroke-dasharray="4,4" />

  <!-- ================= COMPONENT 2: CATALYST BED (left: 280, top: 200, right: 620, bottom: 420) ================= -->
  <g id="catalyst_bed">
    <!-- Ceramic Inert Top Retention Balls -->
    <rect x="290" y="185" width="320" height="25" fill="#334155" opacity="0.6" />
    <text x="450" y="202" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">INERT CERAMIC BALL LAYER</text>

    <!-- Active Catalytic Reaction Bed Zone -->
    <rect x="290" y="210" width="320" height="175" fill="url(#catalystPattern)" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Stainless Steel Support Grid -->
    <line x1="290" y1="385" x2="610" y2="385" stroke="#f59e0b" stroke-width="4" />
    <text x="450" y="315" fill="#fde68a" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Pd/Al2O3 CATALYST BED (3.2 m³)</text>
    <text x="450" y="335" fill="#f59e0b" font-family="monospace" font-size="9" text-anchor="middle">REDUCTION CYCLE: 180°C - 240°C</text>
  </g>

  <!-- ================= COMPONENT 1: MULTIPOINT THERMOCOUPLE (left: 360, top: 140, right: 540, bottom: 400) ================= -->
  <g id="multipoint_thermocouple">
    <!-- Thermowell Sheath Insertion Tube -->
    <rect x="445" y="105" width="10" height="280" fill="#94a3b8" stroke="#38bdf8" stroke-width="1.2" />
    <!-- Flanged Sensor Head on Top Dish -->
    <rect x="430" y="90" width="40" height="20" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    <!-- 8 Multipoint Measuring Junction Nodes -->
    <circle cx="450" cy="225" r="4" fill="#38bdf8" />
    <circle cx="450" cy="250" r="4" fill="#38bdf8" />
    <circle cx="450" cy="275" r="5" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5" /> <!-- Point 3 fault -->
    <text x="470" y="278" fill="#fca5a5" font-family="monospace" font-size="9" font-weight="bold">PT 3 FAULT (OPEN)</text>
    <circle cx="450" cy="300" r="4" fill="#38bdf8" />
    <circle cx="450" cy="325" r="4" fill="#38bdf8" />
    <circle cx="450" cy="350" r="4" fill="#38bdf8" />
    <circle cx="450" cy="375" r="4" fill="#38bdf8" />
    <text x="450" y="130" fill="#38bdf8" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">8-POINT TC WELL</text>
  </g>

  <!-- ================= COMPONENT 3: N2 INERT CONTROL VALVE (left: 620, top: 120, right: 780, bottom: 260) ================= -->
  <g id="n2_inert_valve">
    <!-- Piping branch connecting into top head -->
    <path d="M 580 145 L 650 145 L 650 190 L 710 190" fill="none" stroke="#475569" stroke-width="3" />
    <!-- Valve Body (Globe) -->
    <path d="M 680 180 L 710 195 L 680 210 Z" fill="#334155" stroke="#f59e0b" stroke-width="1.5" />
    <path d="M 740 180 L 710 195 L 740 210 Z" fill="#334155" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Bonnet & Stem -->
    <line x1="710" y1="180" x2="710" y2="155" stroke="#94a3b8" stroke-width="2.5" />
    <!-- Pneumatic Diaphragm Actuator -->
    <ellipse cx="710" cy="145" rx="35" ry="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8" />
    <!-- Positioner Box -->
    <rect x="730" y="152" width="22" height="24" rx="2" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="710" y="230" fill="#fde68a" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">N2 INERT VALVE</text>
    <text x="710" y="244" fill="#f59e0b" font-family="monospace" font-size="8.5" text-anchor="middle">(ACTUATOR SLOW)</text>
  </g>

</svg>
