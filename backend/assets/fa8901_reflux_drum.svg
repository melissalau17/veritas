<svg viewBox="0 0 900 560" width="900" height="560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid_fa" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
      <circle cx="0" cy="0" r="1" fill="#334155" opacity="0.8" />
    </pattern>
    <linearGradient id="drumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="#070b12" />
  <rect width="900" height="560" fill="url(#grid_fa)" />

  <!-- Drawing Border & Header -->
  <rect x="20" y="20" width="860" height="520" fill="none" stroke="#334155" stroke-width="1.5" />
  <rect x="30" y="30" width="280" height="50" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
  <text x="44" y="52" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">FA-8901 · REFLUX DRUM</text>
  <text x="44" y="70" fill="#94a3b8" font-family="monospace" font-size="10.5">HORIZONTAL VAPOR-LIQUID ACCUMULATOR</text>

  <!-- Title block right -->
  <g transform="translate(630, 30)">
    <rect width="240" height="40" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="14" y="18" fill="#94a3b8" font-family="monospace" font-size="9.5">LEVEL TRANSMITTER: LT-8901</text>
    <text x="14" y="32" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">BRIDLE SENSING CALIBRATION</text>
  </g>

  <!-- Drum Saddle Concrete Supports -->
  <path d="M 360 380 L 340 450 L 420 450 L 400 380 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <rect x="330" y="450" width="100" height="15" fill="#334155" />
  <path d="M 640 380 L 620 450 L 700 450 L 680 380 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <rect x="610" y="450" width="100" height="15" fill="#334155" />

  <!-- Centerline -->
  <line x1="220" y1="270" x2="780" y2="270" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="12,4,2,4" opacity="0.4" />

  <!-- ================= COMPONENT 3: DRUM SHELL (left: 240, top: 140, right: 760, bottom: 400) ================= -->
  <g id="drum_shell">
    <!-- Left Dished Head -->
    <path d="M 300 150 Q 250 150 250 270 Q 250 390 300 390 Z" fill="url(#drumGrad)" stroke="#64748b" stroke-width="2.5" />
    <!-- Horizontal Cylindrical Body -->
    <rect x="300" y="150" width="400" height="240" fill="url(#drumGrad)" stroke="#64748b" stroke-width="2.5" />
    <!-- Right Dished Head -->
    <path d="M 700 150 Q 750 150 750 270 Q 750 390 700 390 Z" fill="url(#drumGrad)" stroke="#64748b" stroke-width="2.5" />

    <!-- Cutaway Window to Liquid Level -->
    <rect x="320" y="180" width="360" height="180" rx="4" fill="#080e1a" stroke="#334155" stroke-dasharray="4,4" />
    <!-- Liquid Hydrocarbon Phase (45% Level) -->
    <rect x="320" y="270" width="360" height="90" fill="url(#liquidGrad)" />
    <!-- Liquid-Vapor Interface Surface Line -->
    <line x1="320" y1="270" x2="680" y2="270" stroke="#38bdf8" stroke-width="2" />
    <text x="500" y="260" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">LIQUID-VAPOR INTERFACE (45%)</text>

    <!-- Top Inlet Vapor/Condensate Nozzle -->
    <rect x="420" y="95" width="60" height="55" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <rect x="408" y="85" width="84" height="12" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="1.2" />
    <text x="450" y="78" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">REFLUX CONDENSATE</text>

    <!-- Bottom Liquid Boot / Suction Nozzle -->
    <rect x="580" y="390" width="45" height="55" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <rect x="572" y="445" width="60" height="12" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="1.2" />
    <text x="602" y="475" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">PUMP SUCTION</text>

    <text x="500" y="330" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">HORIZONTAL REFLUX DRUM VESSEL</text>
  </g>

  <!-- ================= COMPONENT 1: LEVEL BRIDLE STANDPIPE (left: 140, top: 140, right: 280, bottom: 420) ================= -->
  <g id="level_bridle">
    <!-- Standpipe Vertical Column (3" Sch 80) -->
    <rect x="180" y="170" width="22" height="200" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <!-- Top Isolation Arm into Drum Vapor Space -->
    <path d="M 202 190 L 260 190" fill="none" stroke="#38bdf8" stroke-width="3" />
    <circle cx="230" cy="190" r="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Bottom Isolation Arm into Drum Liquid Space -->
    <path d="M 202 350 L 260 350" fill="none" stroke="#38bdf8" stroke-width="3" />
    <circle cx="230" cy="350" r="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Displacer / Guided Wave Radar Transmitter Head -->
    <rect x="166" y="130" width="50" height="40" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.8" />
    <text x="191" y="154" fill="#e0f2fe" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">LT-8901</text>

    <!-- Fines Plugging Blockage Highlight in Bottom Arm -->
    <circle cx="245" cy="350" r="9" fill="#ef4444" fill-opacity="0.4" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2" />
    <text x="210" y="415" fill="#fca5a5" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">BRIDLE LEG PLUGGED</text>
    <text x="210" y="428" fill="#ef4444" font-family="monospace" font-size="8.5" text-anchor="middle">(WO-240193 PATTERN)</text>
  </g>

  <!-- ================= COMPONENT 2: IMPULSE SENSING LINE (left: 280, top: 180, right: 420, bottom: 340) ================= -->
  <g id="impulse_line">
    <!-- Impulse Tubing Run -->
    <path d="M 290 190 L 350 190 L 350 250 L 380 250" fill="none" stroke="#f59e0b" stroke-width="2.5" />
    <path d="M 290 350 L 350 350 L 350 270 L 380 270" fill="none" stroke="#f59e0b" stroke-width="2.5" />
    <!-- 3-Valve Manifold Block -->
    <rect x="375" y="240" width="35" height="40" rx="2" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="392" y="264" fill="#fde68a" font-family="monospace" font-size="8" text-anchor="middle">MANIFOLD</text>
    <text x="350" y="225" fill="#f59e0b" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">1/2" IMPULSE TUBING</text>
  </g>

</svg>
