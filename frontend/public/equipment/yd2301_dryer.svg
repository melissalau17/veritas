<svg viewBox="0 0 900 560" width="900" height="560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid_yd" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
      <circle cx="0" cy="0" r="1" fill="#334155" opacity="0.8" />
    </pattern>
    <linearGradient id="dryerShell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <pattern id="bedFluidized" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.5" fill="#38bdf8" fill-opacity="0.3" />
      <circle cx="15" cy="12" r="2" fill="#38bdf8" fill-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="#070b12" />
  <rect width="900" height="560" fill="url(#grid_yd)" />

  <!-- Drawing Border & Header -->
  <rect x="20" y="20" width="860" height="520" fill="none" stroke="#334155" stroke-width="1.5" />
  <rect x="30" y="30" width="280" height="50" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
  <text x="44" y="52" fill="#f59e0b" font-family="monospace" font-size="13" font-weight="bold">YD-2301 · FLUID BED DRYER</text>
  <text x="44" y="70" fill="#94a3b8" font-family="monospace" font-size="10.5">POLYMER POWDER CONTINUOUS STEAM DRYER</text>

  <!-- Title block right -->
  <g transform="translate(630, 30)">
    <rect width="240" height="40" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="14" y="18" fill="#94a3b8" font-family="monospace" font-size="9.5">POWDER: LLDPE PELLETS &amp; POWDER</text>
    <text x="14" y="32" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">GLAND PACKING: PTFE 4526L</text>
  </g>

  <!-- Heavy Isolator Spring Supports -->
  <rect x="220" y="440" width="40" height="30" fill="#334155" stroke="#94a3b8" stroke-width="1.2" />
  <rect x="640" y="440" width="40" height="30" fill="#334155" stroke="#94a3b8" stroke-width="1.2" />

  <!-- Centerline -->
  <line x1="120" y1="280" x2="780" y2="280" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="12,4,2,4" opacity="0.4" />

  <!-- ================= COMPONENT 3: DRYER BED SHELL (left: 200, top: 140, right: 700, bottom: 420) ================= -->
  <g id="dryer_bed_shell">
    <!-- Main Rectangular Fluidized Trough Chamber -->
    <rect x="220" y="160" width="460" height="260" rx="6" fill="url(#dryerShell)" stroke="#64748b" stroke-width="2.5" />
    <!-- Cutaway Window to Inner Fluidized Bed -->
    <rect x="240" y="180" width="420" height="220" rx="4" fill="#0b1120" stroke="#334155" stroke-dasharray="4,4" />

    <!-- Perforated Fluidizing Air Distribution Plate (Bottom) -->
    <line x1="240" y1="350" x2="660" y2="350" stroke="#f59e0b" stroke-width="3" stroke-dasharray="3,3" />
    <!-- Hot Air Plenum Under Plate -->
    <rect x="240" y="352" width="420" height="45" fill="#f59e0b" fill-opacity="0.08" />
    <text x="450" y="378" fill="#f59e0b" font-family="monospace" font-size="9.5" text-anchor="middle">HOT DRYING GAS PLENUM (120°C)</text>

    <!-- Fluidized Polymer Powder Zone -->
    <rect x="240" y="240" width="420" height="110" fill="url(#bedFluidized)" />
    <!-- Fluidized Bubbles & Particles -->
    <text x="450" y="270" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">FLUIDIZED LLDPE POWDER BED</text>

    <!-- Top Exhaust Duct / Bag Filter Connection -->
    <rect x="400" y="100" width="100" height="60" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <rect x="388" y="90" width="124" height="12" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="1.2" />
    <text x="450" y="82" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">VAPOR EXHAUST TO CYCLONE</text>
  </g>

  <!-- ================= COMPONENT 2: FEED-END SHAFT PACKING (left: 140, top: 200, right: 320, bottom: 360) ================= -->
  <g id="feed_end_packing">
    <!-- Rotary Agitator Shaft Drive End -->
    <rect x="120" y="270" width="130" height="20" fill="#64748b" stroke="#94a3b8" stroke-width="1.2" />
    <!-- Feed-End Stuffing Box & Gland Follower -->
    <rect x="190" y="235" width="40" height="90" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <!-- PTFE 4505L Packing Rings -->
    <rect x="198" y="245" width="24" height="70" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1" />
    <text x="175" y="225" fill="#38bdf8" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">FEED PACKING</text>
    <text x="175" y="345" fill="#94a3b8" font-family="monospace" font-size="8.5" text-anchor="middle">PTFE 4505L</text>
  </g>

  <!-- ================= COMPONENT 1: DISCHARGE GLAND PACKING (left: 580, top: 200, right: 760, bottom: 360) ================= -->
  <g id="discharge_gland_packing">
    <!-- Discharge End Shaft Projection -->
    <rect x="650" y="270" width="130" height="20" fill="#64748b" stroke="#94a3b8" stroke-width="1.2" />
    <!-- Discharge Stuffing Box Housing -->
    <rect x="670" y="230" width="45" height="100" rx="3" fill="#0f172a" stroke="#ef4444" stroke-width="2" />
    <!-- Gland Follower Bolts -->
    <rect x="660" y="222" width="10" height="116" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="1" />
    <!-- High-Temp PTFE 4526L Braided Packing Rings -->
    <rect x="678" y="242" width="28" height="76" fill="#ef4444" fill-opacity="0.3" stroke="#fca5a5" stroke-width="1.2" />

    <!-- Steam and Powder Escape Leak Highlight -->
    <path d="M 695 240 Q 730 200 750 210 Q 730 230 710 240" fill="#ef4444" fill-opacity="0.4" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2" />
    <path d="M 695 320 Q 730 350 750 340 Q 730 330 710 320" fill="#ef4444" fill-opacity="0.4" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2" />

    <text x="735" y="260" fill="#fca5a5" font-family="monospace" font-size="10" font-weight="bold">STEAM &amp; POWDER LEAK</text>
    <text x="735" y="275" fill="#ef4444" font-family="monospace" font-size="8.5">(PTFE 4526L WORN)</text>
    <text x="735" y="305" fill="#fde68a" font-family="monospace" font-size="9" font-weight="bold">DISCHARGE GLAND</text>
  </g>

</svg>

