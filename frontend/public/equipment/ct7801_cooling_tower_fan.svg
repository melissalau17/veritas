<svg viewBox="0 0 900 560" width="900" height="560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid_ct" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
      <circle cx="0" cy="0" r="1" fill="#334155" opacity="0.8" />
    </pattern>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="#070b12" />
  <rect width="900" height="560" fill="url(#grid_ct)" />

  <!-- Drawing Border & Header -->
  <rect x="20" y="20" width="860" height="520" fill="none" stroke="#334155" stroke-width="1.5" />
  <rect x="30" y="30" width="240" height="50" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
  <text x="44" y="52" fill="#10b981" font-family="monospace" font-size="13" font-weight="bold">CT-7801 · COOLING TOWER FAN</text>
  <text x="44" y="70" fill="#94a3b8" font-family="monospace" font-size="10.5">INDUCED DRAFT FIBERGLASS FAN CELL</text>

  <!-- Title block right -->
  <g transform="translate(630, 30)">
    <rect width="240" height="40" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="14" y="18" fill="#94a3b8" font-family="monospace" font-size="9.5">FAN DIAMETER: 8.5 M · 8 BLADES</text>
    <text x="14" y="32" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold">VIBRATION LIMIT: 4.5 MM/S RMS</text>
  </g>

  <!-- Fan Cylinder / Stack Throat Shroud (Outline) -->
  <path d="M 80 70 Q 110 240 100 480" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="6,4" />
  <path d="M 820 70 Q 790 240 800 480" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="6,4" />
  <text x="95" y="470" fill="#64748b" font-family="monospace" font-size="10">VENTURI STACK WALL</text>

  <!-- Heavy Support Structural Steel Beams -->
  <rect x="90" y="375" width="720" height="35" rx="3" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <line x1="90" y1="392" x2="810" y2="392" stroke="#64748b" stroke-width="1.5" />
  <!-- Vibration Isolator Springs -->
  <rect x="180" y="410" width="40" height="30" fill="#334155" stroke="#94a3b8" stroke-width="1.2" />
  <rect x="460" y="410" width="40" height="30" fill="#334155" stroke="#94a3b8" stroke-width="1.2" />

  <!-- ================= COMPONENT 4: WET-DUTY MOTOR (left: 120, top: 220, right: 320, bottom: 380) ================= -->
  <g id="wet_duty_motor">
    <!-- Motor Base -->
    <rect x="140" y="350" width="160" height="25" fill="#334155" stroke="#64748b" stroke-width="1.5" />
    <!-- Motor Casing (IP56 Wet Area Enclosure) -->
    <rect x="130" y="235" width="175" height="120" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.8" />
    <!-- Fins -->
    <g stroke="#047857" stroke-width="2">
      <line x1="155" y1="235" x2="155" y2="355" />
      <line x1="175" y1="235" x2="175" y2="355" />
      <line x1="195" y1="235" x2="195" y2="355" />
      <line x1="215" y1="235" x2="215" y2="355" />
      <line x1="235" y1="235" x2="235" y2="355" />
      <line x1="255" y1="235" x2="255" y2="355" />
      <line x1="275" y1="235" x2="275" y2="355" />
    </g>
    <!-- Weather Proof Terminal Box -->
    <rect x="180" y="200" width="60" height="35" rx="3" fill="#047857" stroke="#10b981" stroke-width="1.2" />
    <text x="217" y="320" fill="#a7f3d0" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">55 kW WET-DUTY</text>
  </g>

  <!-- ================= COMPONENT 1: DRIVE-SHAFT COUPLING (left: 320, top: 220, right: 540, bottom: 340) ================= -->
  <g id="drive_shaft_coupling">
    <!-- Composite Floating Drive Shaft Tube -->
    <rect x="330" y="272" width="160" height="16" rx="3" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8" />
    <line x1="330" y1="280" x2="490" y2="280" stroke="#f59e0b" stroke-dasharray="4,2" />
    <!-- Flexible Disc Pack Coupling Motor Side -->
    <rect x="315" y="255" width="22" height="50" rx="3" fill="#f59e0b" fill-opacity="0.5" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Flexible Disc Pack Coupling Gearbox Side -->
    <rect x="480" y="255" width="22" height="50" rx="3" fill="#f59e0b" fill-opacity="0.5" stroke="#f59e0b" stroke-width="1.5" />
    <text x="405" y="260" fill="#fde68a" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">COMPOSITE DRIVE SHAFT</text>
    <text x="405" y="310" fill="#f59e0b" font-family="monospace" font-size="8.5" text-anchor="middle">(WO-240169 REPLACEMENT)</text>
  </g>

  <!-- ================= COMPONENT 3: REDUCTION GEARBOX (left: 400, top: 200, right: 560, bottom: 360) ================= -->
  <g id="reduction_gearbox">
    <!-- Right Angle Bevel Gearbox Housing -->
    <rect x="430" y="225" width="115" height="145" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <!-- Internal Spiral Bevel Gear Meshing Graphic -->
    <circle cx="487" cy="295" r="38" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="6,3" />
    <circle cx="487" cy="295" r="8" fill="#38bdf8" />
    <!-- Vertical Output Shaft Going to Fan Hub -->
    <rect x="477" y="150" width="20" height="75" fill="#64748b" stroke="#94a3b8" stroke-width="1.5" />
    <text x="487" y="350" fill="#38bdf8" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">9.2:1 GEARBOX</text>
  </g>

  <!-- ================= COMPONENT 2: FAN BLADE ASSEMBLY (left: 120, top: 80, right: 780, bottom: 240) ================= -->
  <g id="fan_blade_assembly">
    <!-- Central Fan Hub Disc -->
    <ellipse cx="487" cy="150" rx="60" ry="18" fill="#334155" stroke="#10b981" stroke-width="2" />
    <ellipse cx="487" cy="146" rx="40" ry="12" fill="#475569" stroke="#34d399" stroke-width="1.2" />

    <!-- Left FRP Airfoil Blade (Extending to Stack Wall) -->
    <path d="M 430 146 L 140 105 Q 120 100 135 160 L 430 156 Z" fill="url(#bladeGrad)" stroke="#34d399" stroke-width="2" />
    <line x1="145" y1="110" x2="425" y2="150" stroke="#a7f3d0" stroke-width="1.5" />

    <!-- Right FRP Airfoil Blade (Extending to Stack Wall) -->
    <path d="M 544 146 L 760 105 Q 780 100 765 160 L 544 156 Z" fill="url(#bladeGrad)" stroke="#34d399" stroke-width="2" />
    <line x1="755" y1="110" x2="548" y2="150" stroke="#a7f3d0" stroke-width="1.5" />

    <!-- Blade Balance Weights & Leading Edge erosion zone -->
    <rect x="735" y="105" width="20" height="8" rx="1" fill="#f59e0b" stroke="#fde68a" stroke-width="1" />
    <text x="745" y="95" fill="#f59e0b" font-family="monospace" font-size="9" text-anchor="middle">EROSION ZONE</text>

    <text x="487" y="115" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">FRP FAN HUB &amp; BLADES (8.5M)</text>
  </g>

  <!-- Vibration Sensor VSHH-7802 Indicator -->
  <circle cx="487" cy="225" r="7" fill="#ef4444" stroke="#fca5a5" stroke-width="2" />
  <line x1="487" y1="218" x2="550" y2="180" stroke="#ef4444" stroke-width="1.2" />
  <rect x="550" y="170" width="130" height="22" rx="3" fill="#450a0a" stroke="#ef4444" stroke-width="1" />
  <text x="615" y="185" fill="#fca5a5" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">VSHH-7802 (HIGH VIB)</text>

</svg>

