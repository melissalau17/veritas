<svg viewBox="0 0 900 560" width="900" height="560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Blueprint Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
      <circle cx="0" cy="0" r="1" fill="#334155" opacity="0.8" />
    </pattern>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="bundleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0369a1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="flangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="#070b12" />
  <rect width="900" height="560" fill="url(#grid)" />

  <!-- Drawing Technical Header & Border -->
  <rect x="20" y="20" width="860" height="520" fill="none" stroke="#334155" stroke-width="1.5" />
  <rect x="30" y="30" width="220" height="50" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
  <text x="44" y="52" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">EA-5601 · SOLVENT HEATER</text>
  <text x="44" y="70" fill="#94a3b8" font-family="monospace" font-size="10.5">TEMA AES SHELL &amp; TUBE EXCHANGER</text>

  <!-- Title block right -->
  <g transform="translate(640, 30)">
    <rect width="230" height="40" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="14" y="18" fill="#94a3b8" font-family="monospace" font-size="9.5">PROCESS: HEXANE SOLVENT PREHEAT</text>
    <text x="14" y="32" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">DESIGN DP: 0.85 BAR · 246 TUBES</text>
  </g>

  <!-- Centerline -->
  <line x1="40" y1="280" x2="860" y2="280" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="12,4,2,4" opacity="0.4" />

  <!-- Saddle Supports -->
  <path d="M 280 410 L 260 480 L 340 480 L 320 410 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <rect x="250" y="480" width="100" height="12" rx="2" fill="#334155" />
  <path d="M 600 410 L 580 480 L 660 480 L 640 410 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <rect x="570" y="480" width="100" height="12" rx="2" fill="#334155" />

  <!-- Nozzles -->
  <!-- Shell Inlet Nozzle (Top Steam) -->
  <rect x="300" y="90" width="50" height="55" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <rect x="290" y="80" width="70" height="12" rx="2" fill="url(#flangeGrad)" stroke="#64748b" stroke-width="1.2" />
  <text x="325" y="70" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">STEAM INLET (N1)</text>

  <!-- Shell Outlet Nozzle (Bottom Condensate) -->
  <rect x="580" y="415" width="45" height="50" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <rect x="572" y="465" width="60" height="12" rx="2" fill="url(#flangeGrad)" stroke="#64748b" stroke-width="1.2" />
  <text x="602" y="495" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">CONDENSATE (N2)</text>

  <!-- Tube Side Inlet Nozzle (Channel Bottom) -->
  <rect x="110" y="400" width="45" height="50" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <rect x="102" y="450" width="60" height="12" rx="2" fill="url(#flangeGrad)" stroke="#64748b" stroke-width="1.2" />
  <text x="132" y="475" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">SOLVENT IN</text>

  <!-- Tube Side Outlet Nozzle (Channel Top) -->
  <rect x="110" y="110" width="45" height="55" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <rect x="102" y="98" width="60" height="12" rx="2" fill="url(#flangeGrad)" stroke="#64748b" stroke-width="1.2" />
  <text x="132" y="90" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">SOLVENT OUT</text>

  <!-- ================= COMPONENT 2: SHELL COVER (left: 160-730, top: 140-420) ================= -->
  <rect x="195" y="145" width="510" height="270" rx="6" fill="url(#shellGrad)" stroke="#64748b" stroke-width="2" />
  <!-- Main Shell Wall Cutaway Window -->
  <rect x="215" y="175" width="470" height="210" rx="4" fill="#0b1120" stroke="#334155" stroke-dasharray="4,4" stroke-width="1.2" />

  <!-- ================= COMPONENT 1: TUBE BUNDLE (left: 210-670, top: 180-380) ================= -->
  <g id="tube_bundle">
    <!-- Tube Bundle Background -->
    <rect x="215" y="180" width="460" height="200" fill="url(#bundleGrad)" />
    <!-- Tube Sheets -->
    <rect x="195" y="140" width="20" height="280" fill="url(#flangeGrad)" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="670" y="170" width="16" height="220" fill="url(#flangeGrad)" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Segmental Baffles -->
    <line x1="290" y1="180" x2="290" y2="340" stroke="#38bdf8" stroke-width="3" opacity="0.8" />
    <line x1="370" y1="220" x2="370" y2="380" stroke="#38bdf8" stroke-width="3" opacity="0.8" />
    <line x1="450" y1="180" x2="450" y2="340" stroke="#38bdf8" stroke-width="3" opacity="0.8" />
    <line x1="530" y1="220" x2="530" y2="380" stroke="#38bdf8" stroke-width="3" opacity="0.8" />
    <line x1="610" y1="180" x2="610" y2="340" stroke="#38bdf8" stroke-width="3" opacity="0.8" />
    <!-- Longitudinal Tubes -->
    <g stroke="#38bdf8" stroke-width="1.4" opacity="0.7">
      <line x1="215" y1="195" x2="670" y2="195" />
      <line x1="215" y1="210" x2="670" y2="210" />
      <line x1="215" y1="225" x2="670" y2="225" />
      <line x1="215" y1="240" x2="670" y2="240" />
      <line x1="215" y1="255" x2="670" y2="255" />
      <line x1="215" y1="270" x2="670" y2="270" />
      <line x1="215" y1="285" x2="670" y2="285" />
      <line x1="215" y1="300" x2="670" y2="300" />
      <line x1="215" y1="315" x2="670" y2="315" />
      <line x1="215" y1="330" x2="670" y2="330" />
      <line x1="215" y1="345" x2="670" y2="345" />
      <line x1="215" y1="360" x2="670" y2="360" />
    </g>
    <!-- Fouling deposit highlight in center tubes -->
    <path d="M 330 250 Q 420 230 510 260 Q 450 310 330 280 Z" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2" />
    <text x="430" y="275" fill="#fde68a" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">TUBE-BORE FOULING ZONE</text>
  </g>

  <!-- ================= COMPONENT 3: CHANNEL HEAD (left: 60-210, top: 160-400) ================= -->
  <g id="channel_head">
    <!-- Channel Barrel & Flange -->
    <path d="M 195 140 L 95 140 Q 65 140 65 280 Q 65 420 95 420 L 195 420 Z" fill="url(#shellGrad)" stroke="#64748b" stroke-width="2" />
    <!-- Channel Flange Joint -->
    <rect x="180" y="135" width="16" height="290" rx="2" fill="url(#flangeGrad)" stroke="#94a3b8" stroke-width="1.2" />
    <!-- Pass Partition Plate -->
    <rect x="65" y="276" width="130" height="8" fill="#475569" stroke="#94a3b8" stroke-width="1" />
    <text x="130" y="270" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">PASS PARTITION</text>
    <!-- Channel Flange Bolt heads -->
    <g fill="#94a3b8">
      <circle cx="188" cy="155" r="3" />
      <circle cx="188" cy="185" r="3" />
      <circle cx="188" cy="215" r="3" />
      <circle cx="188" cy="345" r="3" />
      <circle cx="188" cy="375" r="3" />
      <circle cx="188" cy="405" r="3" />
    </g>
  </g>

  <!-- ================= COMPONENT 4: FLOATING HEAD (left: 680-840, top: 160-400) ================= -->
  <g id="floating_head">
    <!-- Shell End Flange -->
    <rect x="705" y="140" width="16" height="280" rx="2" fill="url(#flangeGrad)" stroke="#64748b" stroke-width="1.2" />
    <!-- Outer Shell Bonnet / Cover -->
    <path d="M 721 145 L 770 145 Q 830 145 830 280 Q 830 415 770 415 L 721 415 Z" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <!-- Internal Floating Head Cover (Free to expand axially) -->
    <path d="M 686 175 L 710 175 Q 745 175 745 280 Q 745 385 710 385 L 686 385 Z" fill="#0369a1" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.8" />
    <rect x="684" y="170" width="10" height="220" fill="url(#flangeGrad)" stroke="#38bdf8" stroke-width="1" />
    <!-- Expansion Gap Arrows -->
    <line x1="745" y1="280" x2="775" y2="280" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="760" y="270" fill="#f59e0b" font-family="monospace" font-size="9" text-anchor="middle">EXPANSION</text>
  </g>

  <!-- Instrumentation Taps (PDT-5605) -->
  <g stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3,3">
    <line x1="125" y1="410" x2="125" y2="520" />
    <line x1="125" y1="520" x2="220" y2="520" />
    <line x1="125" y1="150" x2="125" y2="20" />
    <line x1="125" y1="20" x2="220" y2="20" />
  </g>
  <rect x="220" y="508" width="130" height="24" rx="3" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
  <text x="285" y="524" fill="#fde68a" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">PDT-5605 (HIGH dP)</text>

</svg>

